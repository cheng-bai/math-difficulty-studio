<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>试卷总览 · 数学难度研究室</title><style>
:root{--ink:#203a35;--paper:#f5f3ec;--green:#497965;--line:#d9dfd5;--orange:#bd6135}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.8 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:48px 24px}a{color:inherit}h1{font:48px/1.2 Georgia,serif;margin:15px 0}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px;margin-top:32px}.card{background:#fffefb;border:1px solid var(--line);padding:24px}.stats{display:flex;gap:32px;margin:24px 0}.stat b{display:block;font:32px Georgia,serif}.stat span{font-size:13px;color:#6a7871}.bars{display:flex;align-items:end;gap:6px;height:110px;border-bottom:1px solid var(--line)}.bar{background:var(--green);min-width:16px;flex:1;text-decoration:none}.bar.pending{background:#999}.note{margin-top:32px;font-size:14px;color:#6a7871}@media(max-width:500px){h1{font-size:34px}.stats{gap:18px}}
</style></head><body><main><p class="eyebrow">MATH DIFFICULTY STUDIO / 内容快照</p><h1>先看整体，<br>再读每一步。</h1><p>原创示例展示题目、解答与确定性结构分。可通过维护CLI接入自己的授权资料。</p><section id="cards" class="grid"></section><p class="note">结构分不是实测失分率。均值只统计已定分必答小问；待核不按0分。@@PENDING_NOTE@@</p><p><a href="/">← 返回研究室</a></p></main><script>
const papers=@@PAPERS@@;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.querySelector('#cards').innerHTML=papers.map(p=>`<article class="card" data-paper="${esc(p.id)}"><p class="eyebrow">${esc(p.id)}</p><h2>${esc(p.name)}</h2><div class="stats"><div class="stat"><b>${p.stats.valid}/${p.stats.total}</b><span>已定分 / 必答</span></div><div class="stat"><b>${p.stats.mean===null?'—':p.stats.mean.toFixed(2)}</b><span>平均难度D</span></div><div class="stat"><b>${p.stats.pending}</b><span>待核</span></div></div><div class="bars">${p.units.map(q=>`<a class="bar ${q.pending?'pending':''}" style="height:${q.pending?10:Math.max(2,q.D)}%" href="${esc(p.url)}#q=${encodeURIComponent(q.id)}" aria-label="第${esc(q.id)}问 ${q.pending?'待核':'D '+q.D}"></a>`).join('')}</div><p>基础 ${p.stats.bands.基础} / 中档 ${p.stats.bands.中档} / 难题 ${p.stats.bands.难题}</p><a href="${esc(p.url)}">打开题目与解析 →</a></article>`).join('');window.overview={papers};
</script></body></html>
